<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot Launch Interface</title>
    <style>
        /* Base Styling */
        body {
            margin: 0;
            background-color: #050505;
            color: #0f0; /* Changed to green theme */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* Screen Controller */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            position: absolute;
            top: 0; left: 0;
        }
        .screen.active {
            display: flex;
        }

        /* --- SCREEN 1: EMO-Style Robot Eyes (Green) --- */
        .eyes-container {
            display: flex;
            gap: 40px;
            margin-bottom: 80px;
        }
        .eye {
            /* EMO robot eyes are typically wider, rounded rectangles */
            width: 130px; 
            height: 90px;
            background: #0f0;
            border-radius: 40px; 
            box-shadow: 0 0 40px #0f0, inset 0 0 10px #fff;
            animation: emo-blink 4s infinite;
            transform-origin: center;
        }

        /* A more expressive, mechanical double-blink */
        @keyframes emo-blink {
            0%, 88%, 92%, 100% { transform: scaleY(1); border-radius: 40px; }
            90%, 94% { transform: scaleY(0.1); border-radius: 10px; }
        }
        
        button {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            color: #0f0;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transition: all 0.2s ease;
            z-index: 10;
        }
        button:active {
            background: #0f0;
            color: #000;
            transform: scale(0.95);
        }

        /* --- SCREEN 2: Palm Scanner --- */
        .scan-instruction {
            font-size: 24px;
            margin-bottom: 30px;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; text-shadow: 0 0 15px #0f0; }
        }

        .scan-container {
            position: relative;
            width: 320px;
            height: 400px;
            border: 2px dashed #222;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 40px;
            overflow: hidden;
            cursor: pointer;
        }

        /* Natural Hand Alignment */
        .hand-outline {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .fingers {
            position: relative;
            width: 220px;
            height: 120px;
            margin-bottom: -15px; /* Pull palm up over the fingers */
            z-index: 1;
        }
        
        .finger {
            position: absolute;
            width: 35px;
            border: 2px solid #444;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            background: #050505; /* Hides internal lines */
            bottom: 0;
            transition: all 0.4s;
        }
        /* Thumb */
        .finger:nth-child(1) { height: 75px; left: -15px; transform: rotate(-40deg); transform-origin: bottom right; bottom: 10px; }
        /* Index */
        .finger:nth-child(2) { height: 100px; left: 40px; transform: rotate(-10deg); transform-origin: bottom right; }
        /* Middle */
        .finger:nth-child(3) { height: 115px; left: 90px; transform: rotate(0deg); }
        /* Ring */
        .finger:nth-child(4) { height: 105px; left: 140px; transform: rotate(10deg); transform-origin: bottom left; }
        /* Pinky */
        .finger:nth-child(5) { height: 80px; left: 190px; transform: rotate(30deg); transform-origin: bottom left; }

        .palm {
            width: 180px;
            height: 170px;
            border: 2px solid #444;
            border-radius: 40% 40% 45% 45%;
            background: #050505;
            position: relative;
            z-index: 2;
            transition: all 0.4s;
        }

        /* Scanner Laser */
        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #0f0;
            box-shadow: 0 0 25px 8px #0f0;
            display: none;
            z-index: 10;
        }

        /* Scanning Active Animations */
        .scanning .scanner-line {
            display: block;
            animation: sweep 2s linear infinite;
        }
        
        /* Light up sequence */
        .scanning .finger:nth-child(1) { animation: scanGlow 0.4s forwards 0.5s; }
        .scanning .finger:nth-child(2) { animation: scanGlow 0.4s forwards 0.8s; }
        .scanning .finger:nth-child(3) { animation: scanGlow 0.4s forwards 1.1s; }
        .scanning .finger:nth-child(4) { animation: scanGlow 0.4s forwards 1.4s; }
        .scanning .finger:nth-child(5) { animation: scanGlow 0.4s forwards 1.7s; }
        .scanning .palm { animation: scanGlow 0.5s forwards 2.0s; }

        @keyframes sweep {
            0% { top: -10px; }
            50% { top: 100%; }
            100% { top: -10px; }
        }
        @keyframes scanGlow {
            to { 
                border-color: #0f0; 
                background: rgba(0, 255, 0, 0.2); 
                box-shadow: 0 0 20px #0f0; 
            }
        }

        /* --- SCREEN 3: Success & Welcome --- */
        .status-accepted {
            font-size: 70px;
            color: #0f0;
            margin: 0;
            text-shadow: 0 0 30px #0f0;
            letter-spacing: 8px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .welcome-msg {
            font-size: 38px;
            color: #fff;
            margin: 30px 0 0 0;
            line-height: 1.5;
            animation: fadeIn 1s forwards 0.5s;
            opacity: 0;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .highlight {
            color: #0f0;
            font-weight: bold;
            text-shadow: 0 0 10px #0f0;
        }

        /* --- SCREEN 4: Fullscreen Countdown Animation --- */
        #screen-countdown {
            background-color: #050505;
            z-index: 50;
        }
        .countdown-number {
            font-size: 50vw; /* Scales massively to screen size */
            font-weight: 900;
            color: #0f0;
            margin: 0;
            line-height: 1;
            /* Zoom and fade animation per second */
            animation: explode 1s infinite; 
        }

        @keyframes explode {
            0% { transform: scale(0.3); opacity: 0; text-shadow: 0 0 0px #0f0; }
            30% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 80px #0f0; }
            100% { transform: scale(1.5); opacity: 0; text-shadow: 0 0 150px #0f0; }
        }

    </style>
</head>
<body>

    <div id="screen-eyes" class="screen active">
        <div class="eyes-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <button onclick="startScanning()">Initiate Scan</button>
    </div>

    <div id="screen-scan" class="screen">
        <div class="scan-instruction">PLACE HAND ON SENSOR</div>
        
        <div class="scan-container" id="scan-pad" onclick="triggerScanAnimation()">
            <div class="scanner-line"></div>
            <div class="hand-outline">
                <div class="fingers">
                    <div class="finger"></div>
                    <div class="finger"></div>
                    <div class="finger"></div>
                    <div class="finger"></div>
                    <div class="finger"></div>
                </div>
                <div class="palm"></div>
            </div>
        </div>
    </div>

    <div id="screen-success" class="screen">
        <h1 class="status-accepted">ACCEPTED</h1>
        <div class="welcome-msg">
            Welcome <span class="highlight" id="guest-name-display">Guest</span><br>
            to <span class="highlight" id="event-name-display">The Event</span>
        </div>
    </div>

    <div id="screen-countdown" class="screen">
        <div class="countdown-number" id="countdown-display">5</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const guestName = "VIP GUEST";
        const eventName = "THE GRAND LAUNCH";
        
        // --- DOM Elements ---
        const screenEyes = document.getElementById('screen-eyes');
        const screenScan = document.getElementById('screen-scan');
        const screenSuccess = document.getElementById('screen-success');
        const screenCountdown = document.getElementById('screen-countdown');
        const scanPad = document.getElementById('scan-pad');
        const countdownDisplay = document.getElementById('countdown-display');

        // Apply config
        document.getElementById('guest-name-display').innerText = guestName;
        document.getElementById('event-name-display').innerText = eventName;

        // Step 1: Eyes -> Scanner
        function startScanning() {
            screenEyes.classList.remove('active');
            screenScan.classList.add('active');
            
            // Reset states
            scanPad.classList.remove('scanning');
            document.querySelector('.scan-instruction').innerText = "PLACE HAND ON SENSOR";
            
            // Remove previous inline styles added by keyframes (reset visual state)
            const handParts = document.querySelectorAll('.finger, .palm');
            handParts.forEach(part => {
                part.style.animation = 'none';
                part.offsetHeight; /* Trigger reflow to restart animation later */
                part.style.animation = null; 
            });
        }

        // Step 2: Touch Pad -> Animate Scan
        function triggerScanAnimation() {
            if(scanPad.classList.contains('scanning')) return; 

            document.querySelector('.scan-instruction').innerText = "ANALYZING BIOMETRICS...";
            scanPad.classList.add('scanning');

            // Wait 3.5 seconds for scan sweep and finger glow to finish
            setTimeout(() => {
                showSuccessScreen();
            }, 3500);
        }

        // Step 3: Show "Accepted" for a moment
        function showSuccessScreen() {
            screenScan.classList.remove('active');
            screenSuccess.classList.add('active');

            // Hold on the success message for 3 seconds, then start countdown
            setTimeout(() => {
                startFullscreenCountdown();
            }, 3000);
        }

        // Step 4: Big Fullscreen Countdown
        function startFullscreenCountdown() {
            screenSuccess.classList.remove('active');
            screenCountdown.classList.add('active');

            let count = 5;
            countdownDisplay.innerText = count;

            // Sync the number change with the 1s CSS explosion animation
            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    // Slight delay to update the text right as the number scales down to invisible
                    setTimeout(() => {
                        countdownDisplay.innerText = count;
                    }, 50); 
                } else {
                    clearInterval(countdownInterval);
                    resetToStart();
                }
            }, 1000); // exactly 1 second intervals matching the CSS animation
        }

        // Step 5: Back to eyes
        function resetToStart() {
            screenCountdown.classList.remove('active');
            screenEyes.classList.add('active');
        }
    </script>
</body>
</html>
