<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Education Launch Sequence</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling */
        body {
            margin: 0;
            background-color: #010408; /* Deep glass color */
            color: #0f0;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* --- 1: THE ROBOT SHELL OVERLAY (ZOOMED IN) --- */
        .robot-shell-overlay {
            position: fixed;
            top: 50%; left: 50%; 
            width: 100vw; height: 100vh;
            
            /* Stretches the image so only ~60% fits on the screen, cutting off the rest */
            transform: translate(-50%, -50%) scale(1.7);
            
            object-fit: fill; 
            pointer-events: none; 
            z-index: 9999;
            mix-blend-mode: screen; 
        }

        /* --- 2: UTHM LOGO FACE BACKGROUND --- */
        .bg-watermark {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 550px; /* Scaled up to fit new shell */
            height: auto;
            opacity: 0.15; 
            pointer-events: none;
            z-index: 1;
            filter: grayscale(100%) sepia(100%) hue-rotate(180deg) brightness(150%);
        }

        /* --- SCREEN CONTROLLER --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; height: 100%;
            text-align: center;
            position: absolute;
            top: 0; left: 0;
            padding: 80px; 
            box-sizing: border-box;
            z-index: 10;
        }
        .screen.active { display: flex; }

        /* --- SCREEN 1: CYAN TURBINE EYES --- */
        .eyes-container {
            display: flex;
            gap: 160px; /* Increased gap */
            margin-bottom: 70px;
        }
        
        .eye {
            width: 260px; /* Scaled up */
            height: 260px; /* Scaled up */
            border-radius: 50%;
            background-color: #001133;
            box-shadow: 0 0 70px #0088ff, inset 0 0 60px #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: eye-behavior 10s infinite;
        }

        .eye::before {
            content: '';
            position: absolute;
            width: 85%; height: 85%;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, #0ff 0deg 5deg, #0033aa 6deg 10deg);
            -webkit-mask-image: radial-gradient(circle, transparent 25%, black 26%, black 90%, transparent 100%);
            animation: spin 20s linear infinite; 
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 35%; height: 35%;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #0ff 40%, transparent 70%);
            box-shadow: 0 0 35px #fff;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        @keyframes eye-behavior {
            0%, 10% { transform: translate(0, 0) scale(1); }
            12%, 14% { transform: translate(0, 0) scaleY(0.1) scaleX(1.1); } 
            16%, 30% { transform: translate(0, 0) scale(1); }
            35%, 45% { transform: translate(-55px, 0) scale(1); }
            50%, 60% { transform: translate(55px, 0) scale(1); }
            65%, 70% { transform: translate(0, 0) scale(1); }
            75%, 85% { transform: translate(0, -15px) scaleY(0.8) scaleX(1.1); }
            90% { transform: translate(0, 0) scale(1); }
            95%, 97% { transform: translate(0, 0) scaleY(0.1) scaleX(1.1); } 
            100% { transform: translate(0, 0) scale(1); }
        }
        
        #initiate-btn {
            background: rgba(0, 136, 255, 0.1);
            border: 2px solid #0088ff;
            color: #0088ff;
            padding: 25px 50px; /* Enlarged */
            font-size: 28px;    /* Enlarged */
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(0, 136, 255, 0.4);
            transition: all 0.2s ease;
            z-index: 10;
        }
        #initiate-btn:active {
            background: #0088ff;
            color: #fff;
            transform: scale(0.95);
        }

        /* --- SCREEN 2: BLUEPRINT SCANNER --- */
        #screen-scan {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
        }

        .scan-instruction {
            font-size: 34px; /* Enlarged */
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 4px;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; text-shadow: 0 0 25px #0f0; }
        }

        .scan-container {
            position: relative;
            width: 380px; height: 500px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            cursor: pointer; z-index: 10; 
            
            /* Scales the entire scanner unit up by 25% */
            transform: scale(1.25);
            margin-top: 40px;
        }

        .circuit-lines {
            position: absolute; top: 50px;
            width: 250px; height: 400px;
            border-left: 2px solid rgba(0,255,0,0.3);
            border-right: 2px solid rgba(0,255,0,0.3);
            z-index: 0;
        }
        .circuit-lines::after {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
            width: 2px; background: rgba(0,255,0,0.3); transform: translateX(-50%);
        }

        .fingers { position: relative; width: 300px; height: 180px; z-index: 2; }
        
        .finger {
            position: absolute; width: 45px;
            border: 2px solid #0f0; border-radius: 25px;
            background: #010408; bottom: 0; transition: all 0.4s;
            display: flex; justify-content: center; align-items: center;
        }
        .finger::after {
            content: ''; width: 60%; height: 70%;
            border-radius: 20px; border: 1px dashed rgba(0, 255, 0, 0.4);
        }

        .finger:nth-child(1) { height: 90px; left: 0px; transform: rotate(-35deg); transform-origin: bottom right; bottom: -20px; }
        .finger:nth-child(2) { height: 120px; left: 70px; transform: rotate(-10deg); transform-origin: bottom right; }
        .finger:nth-child(3) { height: 135px; left: 135px; transform: rotate(0deg); }
        .finger:nth-child(4) { height: 125px; left: 200px; transform: rotate(10deg); transform-origin: bottom left; }
        .finger:nth-child(5) { height: 100px; left: 260px; transform: rotate(25deg); transform-origin: bottom left; bottom: 10px; }

        .palm {
            width: 200px; height: 190px;
            border: 2px solid #0f0; border-radius: 40% 40% 50% 50%;
            background: #010408; position: relative; z-index: 2; margin-top: 10px;
            display: flex; justify-content: center; align-items: center;
        }
        .palm::after {
            content: ''; width: 70%; height: 70%;
            border-radius: 40%; border: 1px dashed rgba(0, 255, 0, 0.4);
        }

        .tech-data {
            position: absolute; bottom: 20px; right: -60px;
            border: 1px solid #0f0; border-radius: 10px; padding: 10px;
            font-size: 10px; text-align: right; background: rgba(0, 10, 0, 0.8);
            color: rgba(0, 255, 0, 0.7); z-index: 5; display: none;
        }

        .scanner-line {
            position: absolute; top: 0; left: -50px;
            width: calc(100% + 100px); height: 4px;
            background: #fff; box-shadow: 0 0 35px 12px #0f0;
            display: none; z-index: 10;
        }

        .scanning .scanner-line { display: block; animation: sweep 2s linear infinite; }
        .scanning .tech-data { display: block; animation: fadeIn 0.5s forwards; }
        .scanning .finger:nth-child(1) { animation: scanGlow 0.4s forwards 0.5s; }
        .scanning .finger:nth-child(2) { animation: scanGlow 0.4s forwards 0.8s; }
        .scanning .finger:nth-child(3) { animation: scanGlow 0.4s forwards 1.1s; }
        .scanning .finger:nth-child(4) { animation: scanGlow 0.4s forwards 1.4s; }
        .scanning .finger:nth-child(5) { animation: scanGlow 0.4s forwards 1.7s; }
        .scanning .palm { animation: scanGlow 0.5s forwards 2.0s; }

        @keyframes sweep { 0% { top: -20px; } 50% { top: 105%; } 100% { top: -20px; } }
        @keyframes scanGlow { to { background: rgba(0, 255, 0, 0.3); box-shadow: 0 0 30px #0f0; border-color: #fff; } }

        /* --- SCREEN 3: Success --- */
        .status-accepted {
            font-size: 100px; /* Enlarged */
            color: #0f0; margin: 0;
            text-shadow: 0 0 50px #0f0; letter-spacing: 10px; font-weight: 900;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .welcome-msg {
            font-size: 50px; /* Enlarged */
            color: #fff; margin: 40px 0 0 0; line-height: 1.5;
            animation: fadeIn 1s forwards 0.5s; opacity: 0;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        .highlight { color: #0f0; font-weight: 900; text-shadow: 0 0 20px #0f0; }

        /* --- SCREEN 4: Fullscreen Countdown --- */
        .countdown-number {
            font-size: 45vw; font-weight: 900; color: #fff; margin: 0; line-height: 1;
            animation: explode 1s infinite; 
        }
        @keyframes explode {
            0% { transform: scale(0.3); opacity: 0; text-shadow: 0 0 0px #0f0; }
            30% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 80px #0f0, 0 0 120px #0f0; color: #0f0; }
            100% { transform: scale(1.5); opacity: 0; text-shadow: 0 0 150px #0f0; }
        }

        /* --- SCREEN 5: Blank --- */
        #screen-blank { background-color: #000; }

    </style>
</head>
<body>

    <!-- OVERLAY 1: THE ROBOT SHELL -->
    <img src="shell.png" alt="Robot Frame" class="robot-shell-overlay">

    <!-- OVERLAY 2: THE BACKGROUND UTHM LOGO -->
    <img src="image_c8c162_2.png" alt="UTHM Background" class="bg-watermark">

    <!-- SCREEN 1: CYAN TURBINE EYES -->
    <div id="screen-eyes" class="screen active">
        <div class="eyes-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <button id="initiate-btn" onclick="startScanning()">Initiate Sequence</button>
    </div>

    <!-- SCREEN 2: BLUEPRINT SCANNER -->
    <div id="screen-scan" class="screen">
        <div class="scan-instruction">AWAITING BIOMETRIC INPUT</div>
        
        <div class="scan-container" id="scan-pad" onclick="triggerScanAnimation()">
            <div class="circuit-lines"></div>
            <div class="scanner-line"></div>
            
            <div class="fingers">
                <div class="finger"></div>
                <div class="finger"></div>
                <div class="finger"></div>
                <div class="finger"></div>
                <div class="finger"></div>
            </div>
            <div class="palm"></div>

            <div class="tech-data">
                197.148.1.254<br>
                //197.168.1.445 - //197.168.1.ASD<br>
                Information ABC // 197.168.1.333<br>
                > // Loading Information.<br>
                -------------------------<br>
                // ACCESS GRANTED.
            </div>
        </div>
    </div>

    <!-- SCREEN 3: SUCCESS -->
    <div id="screen-success" class="screen">
        <h1 class="status-accepted">ACCESS GRANTED</h1>
        <div class="welcome-msg">
            Welcome <span class="highlight" id="guest-name-display">Guest</span><br>
            to <span class="highlight" id="event-name-display">The Event</span>
        </div>
    </div>

    <!-- SCREEN 4: COUNTDOWN -->
    <div id="screen-countdown" class="screen">
        <div class="countdown-number" id="countdown-display">5</div>
    </div>

    <!-- SCREEN 5: BLANK WAIT SCREEN -->
    <div id="screen-blank" class="screen"></div>

    <script>
        // --- CONFIGURATION ---
        const guestName = "VIP GUEST";
        const eventName = "DIGITAL ED SUMMIT 2026";
        
        // --- DOM Elements ---
        const screenEyes = document.getElementById('screen-eyes');
        const screenScan = document.getElementById('screen-scan');
        const screenSuccess = document.getElementById('screen-success');
        const screenCountdown = document.getElementById('screen-countdown');
        const screenBlank = document.getElementById('screen-blank');
        const scanPad = document.getElementById('scan-pad');
        const countdownDisplay = document.getElementById('countdown-display');
        const initiateBtn = document.getElementById('initiate-btn');

        // Apply config
        document.getElementById('guest-name-display').innerText = guestName;
        document.getElementById('event-name-display').innerText = eventName;

        function startScanning() {
            screenEyes.classList.remove('active');
            screenScan.classList.add('active');
            
            scanPad.classList.remove('scanning');
            document.querySelector('.scan-instruction').innerText = "AWAITING BIOMETRIC INPUT";
            
            const handParts = document.querySelectorAll('.finger, .palm');
            handParts.forEach(part => {
                part.style.animation = 'none';
                part.offsetHeight; 
                part.style.animation = null; 
            });
        }

        function triggerScanAnimation() {
            if(scanPad.classList.contains('scanning')) return; 

            document.querySelector('.scan-instruction').innerText = "ANALYZING BIOMETRICS...";
            scanPad.classList.add('scanning');

            setTimeout(() => {
                showSuccessScreen();
            }, 3500);
        }

        function showSuccessScreen() {
            screenScan.classList.remove('active');
            screenSuccess.classList.add('active');

            setTimeout(() => {
                startFullscreenCountdown();
            }, 3000);
        }

        function startFullscreenCountdown() {
            screenSuccess.classList.remove('active');
            screenCountdown.classList.add('active');

            let count = 5;
            countdownDisplay.innerText = count;

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    setTimeout(() => { countdownDisplay.innerText = count; }, 50); 
                } else {
                    clearInterval(countdownInterval);
                    showBlankScreen();
                }
            }, 1000);
        }

        function showBlankScreen() {
            screenCountdown.classList.remove('active');
            screenBlank.classList.add('active');

            setTimeout(() => {
                resetToStart();
            }, 5000);
        }

        function resetToStart() {
            screenBlank.classList.remove('active');
            screenEyes.classList.add('active');
            initiateBtn.style.display = 'none';
        }
    </script>
</body>
</html>
