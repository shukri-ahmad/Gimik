<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Education Launch Sequence</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling */
        body {
            margin: 0;
            background-color: #010408; 
            color: #0f0;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* --- FULLSCREEN BUTTON --- */
        #fullscreen-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid rgba(0, 255, 0, 0.2);
            color: rgba(0, 255, 0, 0.3);
            width: 40px;
            height: 40px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10000; 
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        #fullscreen-btn:hover, #fullscreen-btn:active {
            background: rgba(0, 255, 0, 0.2);
            border-color: #0f0;
            color: #0f0;
        }

        /* --- 1: THE ROBOT SHELL OVERLAY --- */
        .robot-shell-overlay {
            position: fixed;
            top: 50%; left: 50%; 
            width: 100vw; height: 100vh;
            transform: translate(-50%, -50%) scale(1.3);
            object-fit: fill; 
            pointer-events: none; 
            z-index: 9999;
            mix-blend-mode: screen; 
        }

        /* --- 2: UTHM LOGO FACE BACKGROUND --- */
        .bg-watermark {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 550px; 
            height: auto;
            opacity: 0.15; 
            pointer-events: none;
            z-index: 1;
            filter: grayscale(100%) sepia(100%) hue-rotate(90deg) brightness(150%);
        }

        /* --- SCREEN CONTROLLER --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; height: 100%;
            text-align: center;
            position: absolute;
            top: 0; left: 0;
            padding: 80px; 
            box-sizing: border-box;
            z-index: 10;
        }
        .screen.active { display: flex; }

        /* --- SCREEN 1: GREEN TURBINE EYES --- */
        .eyes-container {
            display: flex;
            gap: 160px; 
            margin-bottom: 120px; 
        }
        
        .eye {
            width: 260px; 
            height: 260px; 
            border-radius: 50%;
            background-color: #001100;
            box-shadow: 0 0 70px #0f0, inset 0 0 60px #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: eye-behavior 10s infinite;
        }

        .eye::before {
            content: '';
            position: absolute;
            width: 85%; height: 85%;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, #0f0 0deg 5deg, #004400 6deg 10deg);
            -webkit-mask-image: radial-gradient(circle, transparent 25%, black 26%, black 90%, transparent 100%);
            animation: spin 20s linear infinite; 
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 35%; height: 35%;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #0f0 40%, transparent 70%);
            box-shadow: 0 0 35px #fff;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        @keyframes eye-behavior {
            0%, 10% { transform: translate(0, 0) scale(1); }
            12%, 14% { transform: translate(0, 0) scaleY(0.1) scaleX(1.1); } 
            16%, 30% { transform: translate(0, 0) scale(1); }
            35%, 45% { transform: translate(-55px, 0) scale(1); }
            50%, 60% { transform: translate(55px, 0) scale(1); }
            65%, 70% { transform: translate(0, 0) scale(1); }
            75%, 85% { transform: translate(0, -15px) scaleY(0.8) scaleX(1.1); }
            90% { transform: translate(0, 0) scale(1); }
            95%, 97% { transform: translate(0, 0) scaleY(0.1) scaleX(1.1); } 
            100% { transform: translate(0, 0) scale(1); }
        }
        
        #initiate-btn {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            color: #0f0;
            padding: 25px 50px; 
            font-size: 28px;    
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
            transition: all 0.2s ease;
            z-index: 10;
            margin-top: 40px;
        }
        #initiate-btn:active {
            background: #0f0;
            color: #000;
            transform: scale(0.95);
        }

        /* --- SCREEN 2: BLUEPRINT SCANNER --- */
        #screen-scan {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
        }

        .scan-instruction {
            font-size: 34px; 
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 4px;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; text-shadow: 0 0 25px #0f0; }
        }

        .scan-container {
            position: relative;
            width: 380px; height: 500px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            cursor: pointer; z-index: 10; 
            transform: scale(1.25);
            margin-top: 40px;
        }

        .circuit-lines {
            position: absolute; top: 50px;
            width: 250px; height: 400px;
            border-left: 2px solid rgba(0,255,0,0.3);
            border-right: 2px solid rgba(0,255,0,0.3);
            z-index: 0;
        }
        .circuit-lines::after {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
            width: 2px; background: rgba(0,255,0,0.3); transform: translateX(-50%);
        }

        .fingers { position: relative; width: 300px; height: 180px; z-index: 2; }
        
        .finger {
            position: absolute; width: 45px;
            border: 2px solid #0f0; border-radius: 25px;
            background: #010408; bottom: 0; transition: all 0.4s;
            display: flex; justify-content: center; align-items: center;
        }
        .finger::after {
            content: ''; width: 60%; height: 70%;
            border-radius: 20px; border: 1px dashed rgba(0, 255, 0, 0.4);
        }

        .finger:nth-child(1) { height: 90px; left: 0px; transform: rotate(-35deg); transform-origin: bottom right; bottom: -20px; }
        .finger:nth-child(2) { height: 120px; left: 70px; transform: rotate(-10deg); transform-origin: bottom right; }
        .finger:nth-child(3) { height: 135px; left: 135px; transform: rotate(0deg); }
        .finger:nth-child(4) { height: 125px; left: 200px; transform: rotate(10deg); transform-origin: bottom left; }
        .finger:nth-child(5) { height: 100px; left: 260px; transform: rotate(25deg); transform-origin: bottom left; bottom: 10px; }

        .palm {
            width: 200px; height: 190px;
            border: 2px solid #0f0; border-radius: 40% 40% 50% 50%;
            background: #010408; position: relative; z-index: 2; margin-top: 10px;
            display: flex; justify-content: center; align-items: center;
        }
        .palm::after {
            content: ''; width: 70%; height: 70%;
            border-radius: 40%; border: 1px dashed rgba(0, 255, 0, 0.4);
        }

        .tech-data {
            position: absolute; bottom: 20px; right: -60px;
            border: 1px solid #0f0; border-radius: 10px; padding: 10px;
            font-size: 10px; text-align: right; background: rgba(0, 10, 0, 0.8);
            color: rgba(0, 255, 0, 0.7); z-index: 5; display: none;
        }

        .scanner-line {
            position: absolute; top: 0; left: -50px;
            width: calc(100% + 100px); height: 4px;
            background: #fff; box-shadow: 0 0 35px 12px #0f0;
            display: none; z-index: 10;
        }

        .scanning .scanner-line { display: block; animation: sweep 2s linear infinite; }
        .scanning .tech-data { display: block; animation: fadeIn 0.5s forwards; }
        .scanning .finger:nth-child(1) { animation: scanGlow 0.4s forwards 0.5s; }
        .scanning .finger:nth-child(2) { animation: scanGlow 0.4s forwards 0.8s; }
        .scanning .finger:nth-child(3) { animation: scanGlow 0.4s forwards 1.1s; }
        .scanning .finger:nth-child(4) { animation: scanGlow 0.4s forwards 1.4s; }
        .scanning .finger:nth-child(5) { animation: scanGlow 0.4s forwards 1.7s; }
        .scanning .palm { animation: scanGlow 0.5s forwards 2.0s; }

        @keyframes sweep { 0% { top: -20px; } 50% { top: 105%; } 100% { top: -20px; } }
        @keyframes scanGlow { to { background: rgba(0, 255, 0, 0.3); box-shadow: 0 0 30px #0f0; border-color: #fff; } }

        /* --- SCREEN 3: Success --- */
        .status-accepted {
            font-size: 100px; 
            color: #0f0; margin: 0;
            text-shadow: 0 0 50px #0f0; letter-spacing: 10px; font-weight: 900;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .welcome-msg {
            font-size: 50px; 
            color: #fff; margin: 40px 0 0 0; line-height: 1.5;
            animation: fadeIn 1s forwards 0.5s; opacity: 0;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        .highlight { color: #0f0; font-weight: 900; text-shadow: 0 0 20px #0f0; }

        /* --- SCREEN 4: COUNTDOWN WITH PROGRESS BAR --- */
        .countdown-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 20;
        }

        .countdown-number {
            font-size: 250px; 
            font-weight: 900; 
            color: #fff; 
            margin: 0; 
            line-height: 1;
            text-shadow: 0 0 30px #0f0, 0 0 60px #0f0;
            animation: digital-pop 1s infinite; 
        }

        @keyframes digital-pop {
            0% { transform: scale(0.8); opacity: 0; }
            10% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 50px #0f0, 0 0 100px #0f0; }
            20% { transform: scale(1); opacity: 1; text-shadow: 0 0 20px #0f0; }
            90% { transform: scale(1); opacity: 1; text-shadow: 0 0 20px #0f0; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        .progress-bar-container {
            width: 60%;
            max-width: 600px;
            height: 15px;
            border: 2px solid #0f0;
            background: rgba(0, 50, 0, 0.4);
            border-radius: 10px;
            margin-top: 120px; 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%; 
            background: #0f0;
            box-shadow: 0 0 20px #0f0, inset 0 0 10px #fff;
        }

        @keyframes grow-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- SCREEN 5: FINAL LOGO --- */
        #screen-final-logo { 
            background-color: #000; 
            z-index: 100; 
        }

        .final-logo {
            max-width: 70%;
            max-height: 70%;
            
            /* Magic trick for JPGs: This deletes a solid black background */
            mix-blend-mode: screen;

            /* This applies the white glow/outline to the image */
            filter: 
                drop-shadow(3px 3px 0px #fff) 
                drop-shadow(-3px -3px 0px #fff) 
                drop-shadow(3px -3px 0px #fff) 
                drop-shadow(-3px 3px 0px #fff)
                drop-shadow(0px 0px 30px rgba(255, 255, 255, 0.8));
            
            animation: zoomInLogo 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes zoomInLogo {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <!-- FULLSCREEN TOGGLE BUTTON -->
    <button id="fullscreen-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">⛶</button>

    <!-- OVERLAY 1: THE ROBOT SHELL -->
    <img src="shell.png" alt="Robot Frame" class="robot-shell-overlay">

    <!-- OVERLAY 2: THE BACKGROUND UTHM LOGO -->
    <img src="image_c8c162_2.png" alt="UTHM Background" class="bg-watermark">

    <!-- SCREEN 1: GREEN TURBINE EYES -->
    <div id="screen-eyes" class="screen active">
        <div class="eyes-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <button id="initiate-btn" onclick="startScanning()">Initiate Sequence</button>
    </div>

    <!-- SCREEN 2: BLUEPRINT SCANNER -->
    <div id="screen-scan" class="screen">
        <div class="scan-instruction">AWAITING BIOMETRIC INPUT</div>
        
        <div class="scan-container" id="scan-pad" onclick="triggerScanAnimation()">
            <div class="circuit-lines"></div>
            <div class="scanner-line"></div>
            
            <div class="fingers">
                <div class="finger"></div>
                <div class="finger"></div>
                <div class="finger"></div>
                <div class="finger"></div>
                <div class="finger"></div>
            </div>
            <div class="palm"></div>

            <div class="tech-data">
                197.148.1.254<br>
                //197.168.1.445 - //197.168.1.ASD<br>
                Information ABC // 197.168.1.333<br>
                > // Loading Information.<br>
                -------------------------<br>
                // ACCESS GRANTED.
            </div>
        </div>
    </div>

    <!-- SCREEN 3: SUCCESS -->
    <div id="screen-success" class="screen">
        <h1 class="status-accepted">ACCESS GRANTED</h1>
        <div class="welcome-msg">
            Welcome <span class="highlight" id="guest-name-display">Guest</span><br>
            to <span class="highlight" id="event-name-display">The Event</span>
        </div>
    </div>

    <!-- SCREEN 4: COUNTDOWN WITH PROGRESS BAR -->
    <div id="screen-countdown" class="screen">
        <div class="countdown-wrapper">
            <div class="countdown-number" id="countdown-display">5</div>
            
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- SCREEN 5: FINAL LOGO SCREEN (Displays for 30 sec) -->
    <div id="screen-final-logo" class="screen">
        <!-- EXACT FILENAME RESTORED -->
        <img src="LOGO-Photoroom.jpg" alt="Final Logo Error - Please check file name/location" class="final-logo">
    </div>

    <script>
        // --- CONFIGURATION ---
        const guestName = "VIP GUEST";
        const eventName = "DIGITAL ED SUMMIT 2026";
        
        // --- DOM Elements ---
        const screenEyes = document.getElementById('screen-eyes');
        const screenScan = document.getElementById('screen-scan');
        const screenSuccess = document.getElementById('screen-success');
        const screenCountdown = document.getElementById('screen-countdown');
        const screenFinalLogo = document.getElementById('screen-final-logo');
        const scanPad = document.getElementById('scan-pad');
        const countdownDisplay = document.getElementById('countdown-display');
        const initiateBtn = document.getElementById('initiate-btn');
        const progressFill = document.getElementById('progress-fill');

        // Apply config
        document.getElementById('guest-name-display').innerText = guestName;
        document.getElementById('event-name-display').innerText = eventName;

        // ==========================================
        //         AUDIO SYNTHESIZER ENGINE
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let scanOsc = null;
        let scanGain = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playStartupSound() {
            playTone(600, 'square', 0.1, 0.05);
            setTimeout(() => playTone(900, 'square', 0.2, 0.05), 100);
        }

        function playSuccessSound() {
            playTone(440, 'sine', 1, 0.1);   
            setTimeout(() => playTone(554.37, 'sine', 1, 0.1), 100); 
            setTimeout(() => playTone(659.25, 'sine', 1.5, 0.1), 200); 
        }

        function playCountdownBeep() {
            playTone(800, 'square', 0.15, 0.05); 
        }

        function playBassDrop() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 2);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 3);
        }

        function startScanSound() {
            if (!audioCtx) return;
            scanOsc = audioCtx.createOscillator();
            scanGain = audioCtx.createGain();
            scanOsc.type = 'sawtooth';
            
            scanOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
            scanOsc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 1.5);
            scanOsc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 3.0);
            
            scanGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            
            scanOsc.connect(scanGain);
            scanGain.connect(audioCtx.destination);
            scanOsc.start();
        }

        function stopScanSound() {
            if (scanOsc) {
                scanOsc.stop();
                scanOsc.disconnect();
                scanGain.disconnect();
            }
        }

        // ==========================================
        //         APPLICATION LOGIC
        // ==========================================

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function startScanning() {
            initAudio();
            playStartupSound();

            screenEyes.classList.remove('active');
            screenScan.classList.add('active');
            
            scanPad.classList.remove('scanning');
            document.querySelector('.scan-instruction').innerText = "AWAITING BIOMETRIC INPUT";
            
            const handParts = document.querySelectorAll('.finger, .palm');
            handParts.forEach(part => {
                part.style.animation = 'none';
                part.offsetHeight; 
                part.style.animation = null; 
            });
        }

        function triggerScanAnimation() {
            if(scanPad.classList.contains('scanning')) return; 

            document.querySelector('.scan-instruction').innerText = "ANALYZING BIOMETRICS...";
            scanPad.classList.add('scanning');

            startScanSound();

            setTimeout(() => {
                stopScanSound();
                showSuccessScreen();
            }, 3500);
        }

        function showSuccessScreen() {
            playSuccessSound();

            screenScan.classList.remove('active');
            screenSuccess.classList.add('active');

            setTimeout(() => {
                startFullscreenCountdown();
            }, 3000);
        }

        function startFullscreenCountdown() {
            screenSuccess.classList.remove('active');
            screenCountdown.classList.add('active');

            progressFill.style.animation = 'none';
            progressFill.offsetHeight; 
            progressFill.style.animation = 'grow-bar 5s linear forwards';

            let count = 5;
            countdownDisplay.innerText = count;
            playCountdownBeep(); 

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDisplay.innerText = count;
                    playCountdownBeep(); 
                } else {
                    clearInterval(countdownInterval);
                    showFinalLogoScreen();
                }
            }, 1000);
        }

        function showFinalLogoScreen() {
            playBassDrop(); 

            screenCountdown.classList.remove('active');
            screenFinalLogo.classList.add('active');

            // Wait exactly 30 seconds before resetting back to eyes
            setTimeout(() => {
                resetToStart();
            }, 30000); 
        }

        function resetToStart() {
            screenFinalLogo.classList.remove('active');
            screenEyes.classList.add('active');
            initiateBtn.style.display = 'none';
        }
    </script>
</body>
</html>
