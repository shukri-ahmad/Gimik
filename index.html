<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot Launch Interface</title>
    <style>
        /* Base Styling */
        body {
            margin: 0;
            background-color: #050505;
            color: #0f0; /* Changed to green theme */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* Screen Controller */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            position: absolute;
            top: 0; left: 0;
        }
        .screen.active {
            display: flex;
        }

        /* --- SCREEN 1: EMO-Style Robot Eyes (Green) --- */
        .eyes-container {
            display: flex;
            gap: 40px;
            margin-bottom: 80px;
        }
        .eye {
            /* EMO robot eyes are typically wider, rounded rectangles */
            width: 130px; 
            height: 90px;
            background: #0f0;
            border-radius: 40px; 
            box-shadow: 0 0 40px #0f0, inset 0 0 10px #fff;
            animation: emo-blink 4s infinite;
            transform-origin: center;
        }

        /* A more expressive, mechanical double-blink */
        @keyframes emo-blink {
            0%, 88%, 92%, 100% { transform: scaleY(1); border-radius: 40px; }
            90%, 94% { transform: scaleY(0.1); border-radius: 10px; }
        }
        
        button {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            color: #0f0;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transition: all 0.2s ease;
            z-index: 10;
        }
        button:active {
            background: #0f0;
            color: #000;
            transform: scale(0.95);
        }

        /* --- SCREEN 2: Palm Scanner --- */
        .scan-instruction {
            font-size: 24px;
            margin-bottom: 30px;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; text-shadow: 0 0 15px #0f0; }
        }

        .scan-container {
            position: relative;
            width: 320px;
            height: 400px;
            border: 2px dashed #222;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 40px;
            overflow: hidden;
            cursor: pointer;
        }

        /* Natural Hand Alignment */
        .hand-outline {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .fingers {
            position: relative;
            width: 220px;
            height: 120px;
            margin-bottom: -15px; /* Pull palm up over the fingers */
            z-index: 1;
        }
        
        .finger {
            position: absolute;
            width: 35px;
            border: 2px solid #444;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            background: #050505; /* Hides internal lines */
            bottom: 0;
            transition: all 0.4s;
        }
        /* Thumb */
        .finger:nth-child(1) { height: 75px; left: -15px; transform: rotate(-40deg); transform-origin: bottom right; bottom: 10px; }
        /* Index */
        .finger:nth-child(2) { height: 100px; left: 40px; transform: rotate(-10deg); transform-origin: bottom right; }
        /* Middle */
        .finger:nth-child(3) { height: 115px; left: 90px; transform: rotate(0deg); }
        /* Ring */
        .finger:nth-child(4) { height: 105px; left: 140px; transform: rotate(10deg); transform-origin: bottom left; }
        /* Pinky */
        .finger:nth-child(5) { height: 80px; left: 190px; transform: rotate(30deg); transform-origin: bottom left; }

        .palm {
            width: 180px;
            height: 170px;
            border: 2px solid #444;
            border-radius: 40% 40% 45% 45%;
            background: #050505;
            position: relative;
            z-index: 2;
            transition: all 0.4s;
        }

        /* Scanner Laser */
        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #0f0;
            box-shadow: 0 0 25px 8px #0f0;
            display: none;
            z-index: 10;
        }

        /* Scanning Active Animations */
        .scanning .scanner-line {
            display: block;
            animation: sweep 2s linear infinite;
        }
        
        /* Light up sequence */
        .scanning .finger:nth-child(1) { animation: scanGlow 0.4s forwards 0.5s; }
        .scanning .finger:nth-child(2) { animation: scanGlow 0.4s forwards 0.8s; }
        .scanning .finger:nth-child(3) { animation: scanGlow 0.4s forwards 1.1s; }
